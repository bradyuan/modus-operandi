<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc; --label: #1d4ed8; --ok: #2f7d4f; --bad: #b42318; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1f1d; --ink: #ecebe7; --muted: #9b9a95; --line: #33322f; --label: #8fa5ff; --ok: #6cc690; --bad: #f08a80; color-scheme: dark; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
  .box { padding: 14px 16px; }
  .label { font-weight: 700; font-size: 15px; color: var(--label); }
  .muted { color: var(--muted); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 8px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
</style>
</head>
<body>
<div class="box">
  <div class="label" id="label">MO</div>
  <div class="muted" id="meta">waiting for MO…</div>
  <div class="row" id="buttons"></div>
  <div id="status" class="muted">Only clicks in this box count. Typed answers in the chat aren't recorded.</div>
</div>
<script>
// Data arrives either through ChatGPT's window.openai globals or the MCP Apps postMessage bridge.
// The key lives only in the tool result's hidden _meta; it is never put into widget state.
let output = null, key = null, endpoint = null;

function find(obj, field, depth = 0) {
  if (!obj || typeof obj !== "object" || depth > 5) return undefined;
  if (field in obj) return obj[field];
  for (const v of Object.values(obj)) { const r = find(v, field, depth + 1); if (r !== undefined) return r; }
  return undefined;
}

function absorb(structured, meta) {
  if (structured) output = structured;
  if (meta) { key = find(meta, "mo/key") ?? key; endpoint = find(meta, "mo/endpoint") ?? endpoint; }
  render();
}

function render() {
  if (!output) return;
  document.getElementById("label").textContent = output.label || "MO";
  document.getElementById("meta").innerHTML =
    `box ${output.box} · key ${key ? `<span class="ok">received …${key.slice(-4)}</span>` : `<span class="bad">missing</span>`}`;
  const row = document.getElementById("buttons");
  if (!row.children.length) for (const choice of output.choices || []) {
    const b = document.createElement("button");
    b.textContent = choice;
    b.onclick = () => send(choice);
    row.appendChild(b);
  }
}

async function send(choice) {
  const status = document.getElementById("status");
  if (!key || !endpoint) { status.innerHTML = `<span class="bad">No key from MO, so this click can't be recorded.</span>`; return; }
  status.textContent = "sending to MO…";
  try {
    const r = await fetch(`${endpoint}/box/${output.box}/event`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key, action: "pick", choice}),
    });
    const body = await r.json();
    status.innerHTML = r.ok ? `<span class="ok">MO recorded: HUMAN USER picked ${body.choice}</span>`
                            : `<span class="bad">MO refused: ${body.error}</span>`;
  } catch (e) {
    status.innerHTML = `<span class="bad">Couldn't reach MO directly (${e.message}).</span>`;
  }
}

// ChatGPT globals (compatibility API)
function fromOpenAI() {
  const o = window.openai;
  if (o) absorb(o.toolOutput, o.toolResponseMetadata);
}
window.addEventListener("openai:set_globals", fromOpenAI);
fromOpenAI();

// MCP Apps bridge
let nextId = 1;
function post(msg) { window.parent.postMessage({jsonrpc: "2.0", ...msg}, "*"); }
window.addEventListener("message", (event) => {
  const m = event.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.method === "ui/notifications/tool-result") absorb(m.params?.structuredContent, m.params?._meta ?? m.params);
  if (m.id === 1 && m.result) post({method: "ui/notifications/initialized", params: {}});
});
if (!window.openai) {
  post({id: nextId++, method: "ui/initialize",
        params: {protocolVersion: "2026-01-26", appInfo: {name: "MO", version: "1"}, appCapabilities: {}}});
}
</script>
</body>
</html>
