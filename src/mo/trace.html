<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MO trace</title>
<style>
  :root { --bg: #f7f6f3; --card: #fff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc;
          --human: #1d4ed8; --chatgpt: #7c3aed; --mo: #4b5563; --dev: #b45309; --bad: #b42318; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161614; --card: #1f1f1d; --ink: #ecebe7; --muted: #9b9a95; --line: #33322f;
            --human: #8fa5ff; --chatgpt: #c4a5ff; --mo: #a3a3a3; --dev: #f0b46b; --bad: #f08a80; color-scheme: dark; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-top: 16px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .actor { font-weight: 700; white-space: nowrap; }
  .HUMAN { color: var(--human); } .CHATGPT { color: var(--chatgpt); } .MO { color: var(--mo); } .DEV { color: var(--dev); }
  .refused td { color: var(--bad); }
  code { font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>MO trace</h1>
  <div class="muted">Every event MO recorded, newest first, refreshing live. HUMAN USER events can only come
    from a click in an MO box signed with that box's key. JSON: <code>/trace/events?actor=…&amp;box=…</code></div>
  <div class="wrap"><table>
    <thead><tr><th>time</th><th>actor</th><th>event</th><th>details</th></tr></thead>
    <tbody id="rows"><tr><td colspan="4" class="muted">No events yet.</td></tr></tbody>
  </table></div>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
async function load() {
  const events = (await (await fetch("/trace/events")).json()).reverse();
  if (!events.length) return;
  document.getElementById("rows").innerHTML = events.map(e => {
    const {at, actor, type, ...rest} = e;
    return `<tr class="${type === "refused" ? "refused" : ""}"><td>${new Date(at * 1000).toLocaleTimeString()}</td>
      <td class="actor ${actor.split(" ")[0]}">${esc(actor)}</td><td>${esc(type)}</td>
      <td><code>${esc(JSON.stringify(rest))}</code></td></tr>`;
  }).join("");
}
load();
setInterval(load, 2000);
</script>
</body>
</html>
