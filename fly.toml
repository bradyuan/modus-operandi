# MO on Fly.io: one small machine, one persistent volume for MO's data.
# `make setup-host APP=<name>` fills in the app name; `make deploy` ships each change.
app = "modus-operandi-v1"
primary_region = "sjc"

[env]
  MO_HOME = "/data"

[[mounts]]
  source = "mo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # sleeps when idle (costs ~nothing); wakes on the next request
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
