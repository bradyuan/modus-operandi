[project]
name = "mo"
version = "1.0.0.dev0"
description = "Tune and seed ChatGPT's output into your voice; MO keeps the books, you judge"
authors = [
    { name = "Brad Yuan", email = "38081482+bradyuan@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
mo = "mo.dev:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
