[project]
name = "mo"
version = "0.1.0"
description = "A harness that gives AI a persistent profile of how you read and write"
authors = [
    { name = "Brad Yuan", email = "38081482+bradyuan@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
mo-server = "mo.server:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
